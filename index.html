<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>セットログ風 自動Vlog動画編集</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fbf7f5 0%, #f5ece9 50%, #f0e6e4 100%);
            color: #4a403a;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(235, 218, 212, 0.7);
            box-shadow: 0 10px 30px -5px rgba(210, 180, 175, 0.15);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(245, 236, 233, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(225, 160, 150, 0.5);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(215, 140, 130, 0.8);
        }
    </style>
</head>
<body class="min-h-screen pb-12 text-stone-700 flex flex-col items-center">
    <!-- Hidden container for off-screen video elements (prevents Safari/Chrome buffering stalls) -->
    <div id="hiddenVideoContainer" class="fixed -left-[9999px] top-0 w-1 h-1 overflow-hidden pointer-events-none opacity-0" aria-hidden="true"></div>

    <!-- Header -->
    <header class="w-full border-b border-rose-100/80 bg-white/70 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-rose-300 to-amber-200 flex items-center justify-center shadow-md shadow-rose-200/50">
                    <i class="fa-solid fa-film text-white text-base"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-tight text-stone-800 flex items-center gap-2">
                        Setlog Vlog AI <span class="bg-rose-100 text-rose-600 text-[10px] font-bold px-2 py-0.5 rounded-full border border-rose-200/60">Pastel Studio</span>
                    </h1>
                    <p class="text-[11px] text-stone-500">撮影日付・時刻スタンプ付き自動Vlogジェネレーター</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl w-full px-4 pt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Panel: Upload & Controls -->
        <div class="lg:col-span-5 space-y-5">
            
            <!-- File Upload Box -->
            <div class="glass-panel rounded-3xl p-5 space-y-4">
                <h2 class="font-bold text-stone-700 text-sm flex items-center gap-2 border-b border-rose-100/80 pb-3">
                    <i class="fa-solid fa-cloud-arrow-up text-rose-400"></i> 動画を選択
                </h2>
                
                <label for="videoInput" class="group relative border-2 border-dashed border-rose-200 hover:border-rose-400 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer transition-all duration-300 bg-rose-50/30 hover:bg-rose-50/70 text-center shadow-sm">
                    <input type="file" id="videoInput" accept="video/*" multiple class="hidden">
                    <div class="w-12 h-12 rounded-full bg-rose-100/80 group-hover:bg-rose-200/80 text-rose-500 flex items-center justify-center transition-colors mb-2 shadow-inner">
                        <i class="fa-solid fa-video text-lg"></i>
                    </div>
                    <span class="text-xs font-bold text-stone-700 group-hover:text-rose-600 transition-colors">動画ファイルをアップロード</span>
                    <span class="text-[10px] text-stone-400 mt-1">複数ファイル選択対応 (iPhone/Android/PC)</span>
                </label>

                <!-- File List Container -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-xs font-semibold text-stone-500">
                        <span>選択された動画</span>
                        <span id="clipCount" class="text-rose-500 font-bold">0 件</span>
                    </div>

                    <div id="clipList" class="max-h-48 overflow-y-auto space-y-2 pr-1 hidden">
                        <!-- Clips inserted via JavaScript -->
                    </div>

                    <div id="emptyClipsState" class="text-center py-6 border border-rose-100/80 rounded-2xl bg-white/40">
                        <p class="text-xs text-stone-400">まだ動画が選択されていません</p>
                    </div>

                    <button id="clearAllBtn" onclick="clearAllClips()" class="hidden w-full py-1.5 text-xs text-stone-500 hover:text-rose-500 transition-colors border border-rose-200 rounded-xl bg-white/60 hover:bg-rose-50/50">
                        <i class="fa-solid fa-trash-can mr-1"></i> すべてクリア
                    </button>
                </div>
            </div>

            <!-- Settings Card -->
            <div class="glass-panel rounded-3xl p-5 space-y-4">
                <h3 class="font-bold text-stone-700 text-sm flex items-center gap-2 border-b border-rose-100/80 pb-3">
                    <i class="fa-solid fa-sliders text-rose-400"></i> 自動編集設定
                </h3>

                <!-- BGM & BPM Section -->
                <div class="p-3 bg-white/70 border border-rose-200/80 rounded-2xl space-y-3 shadow-sm">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-stone-700 flex items-center gap-1.5">
                            <i class="fa-solid fa-music text-rose-400"></i> BGM音楽ファイル
                        </label>
                        <span id="bpmBadge" class="text-[10px] font-bold bg-stone-100 text-stone-500 px-2 py-0.5 rounded-full border border-stone-200">BPM: 未検出</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <label for="bgmInput" class="flex-1 cursor-pointer py-2 px-3 bg-rose-50 hover:bg-rose-100/70 border border-rose-200 rounded-xl text-xs font-semibold text-rose-600 text-center transition-colors truncate">
                            <i class="fa-solid fa-file-audio mr-1"></i> <span id="bgmFileName">BGMを選択 (.mp3 / .wav)</span>
                            <input type="file" id="bgmInput" accept="audio/*" class="hidden">
                        </label>
                        <button id="clearBgmBtn" onclick="clearBgm()" class="hidden py-2 px-3 border border-stone-200 rounded-xl text-xs text-stone-500 hover:text-rose-500 hover:bg-white transition-colors">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div id="bpmOptions" class="hidden space-y-2 pt-1 border-t border-rose-100">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-stone-600">カットタイミング</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="useBpmSync" checked class="sr-only peer">
                                <div class="w-9 h-5 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-rose-400"></div>
                            </label>
                        </div>

                        <div id="bpmBeatSelectContainer" class="grid grid-cols-3 sm:grid-cols-6 gap-1 pt-1">
                            <button type="button" onclick="setBpmBeat(1)" class="bpm-beat-btn py-1 px-1 text-[10px] font-bold border rounded-lg text-center bg-white border-stone-200 text-stone-600">1拍</button>
                            <button type="button" onclick="setBpmBeat(2)" class="bpm-beat-btn py-1 px-1 text-[10px] font-bold border rounded-lg text-center bg-white border-stone-200 text-stone-600">2拍</button>
                            <button type="button" onclick="setBpmBeat(4)" class="bpm-beat-btn active py-1 px-1 text-[10px] font-bold border rounded-lg text-center bg-rose-400 border-rose-400 text-white shadow-sm">4拍</button>
                            <button type="button" onclick="setBpmBeat(8)" class="bpm-beat-btn py-1 px-1 text-[10px] font-bold border rounded-lg text-center bg-white border-stone-200 text-stone-600">8拍</button>
                            <button type="button" onclick="setBpmBeat('random')" class="bpm-beat-btn py-1 px-1 text-[10px] font-bold border rounded-lg text-center bg-white border-stone-200 text-stone-600">ランダム</button>
                            <button type="button" onclick="setBpmBeat('song-fit')" class="bpm-beat-btn py-1 px-1 text-[10px] font-bold border rounded-lg text-center bg-white border-stone-200 text-stone-600 col-span-3 sm:col-span-1 border-rose-300 text-rose-600 bg-rose-50/50">1曲フィット</button>
                        </div>

                        <!-- 1曲フィット専用設定パネル -->
                        <div id="songFitSettings" class="hidden pt-2 border-t border-dashed border-rose-200/80 space-y-2">
                            <div class="text-[11px] font-bold text-stone-600 flex items-center justify-between">
                                <span><i class="fa-solid fa-sliders text-rose-400 mr-1"></i> 1曲フィット時の拍数範囲</span>
                                <span id="songFitRangeBadge" class="text-[10px] text-rose-500 font-mono">1拍 〜 16拍</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] font-bold text-stone-500 block mb-1">最小カット拍数</label>
                                    <select id="minCutBeats" onchange="onSongFitRangeChange()" class="w-full bg-white border border-rose-200 rounded-lg px-2 py-1 text-xs text-stone-700 focus:outline-none focus:border-rose-400 shadow-sm">
                                        <option value="1" selected>1拍 (約0.5秒)</option>
                                        <option value="2">2拍 (約1秒)</option>
                                        <option value="4">4拍 (約2秒)</option>
                                        <option value="8">8拍 (約4秒)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-stone-500 block mb-1">最大カット拍数</label>
                                    <select id="maxCutBeats" onchange="onSongFitRangeChange()" class="w-full bg-white border border-rose-200 rounded-lg px-2 py-1 text-xs text-stone-700 focus:outline-none focus:border-rose-400 shadow-sm">
                                        <option value="2">2拍 (約1秒)</option>
                                        <option value="4">4拍 (約2秒)</option>
                                        <option value="8">8拍 (約4秒)</option>
                                        <option value="16" selected>16拍 (約8秒)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- BGM Volume Slider -->
                    <div id="bgmVolumeContainer" class="hidden space-y-1 pt-1">
                        <div class="flex justify-between text-[11px] font-bold text-stone-500">
                            <span>BGM音量</span>
                            <span id="bgmVolumeVal">70%</span>
                        </div>
                        <input type="range" id="bgmVolume" min="0" max="1" step="0.05" value="0.7" class="w-full h-1.5 bg-rose-100 rounded-lg appearance-none cursor-pointer accent-rose-400">
                    </div>
                </div>

                <div class="space-y-3">
                    <div id="manualDurationContainer">
                        <label class="text-xs font-bold text-stone-600 flex justify-between mb-1.5">
                            <span>1クリップあたりのカット秒数</span>
                            <span id="durationValue" class="text-rose-500 font-bold">2.0 秒</span>
                        </label>
                        <input type="range" id="clipDuration" min="0.5" max="5" step="0.1" value="2" class="w-full h-2 bg-rose-100/80 rounded-lg appearance-none cursor-pointer accent-rose-400">
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <div>
                            <label class="text-xs font-bold text-stone-600 block mb-1.5">出力アスペクト比</label>
                            <select id="aspectRatio" class="w-full bg-white border border-rose-200/80 rounded-xl px-3 py-2 text-xs text-stone-700 focus:outline-none focus:border-rose-400 shadow-sm">
                                <option value="9:16">9:16 (TikTok/Reels/Shorts)</option>
                                <option value="16:9">16:9 (YouTube/横画面)</option>
                                <option value="1:1">1:1 (スクエア)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-stone-600 block mb-1.5">表示コンテンツ</label>
                            <select id="stampFormat" class="w-full bg-white border border-rose-200/80 rounded-xl px-3 py-2 text-xs text-stone-700 focus:outline-none focus:border-rose-400 shadow-sm">
                                <option value="time-only">時刻のみ (例 14:30)</option>
                                <option value="date-time">日付 ＋ 時刻 (例 2026/08/22 14:30)</option>
                                <option value="date-only">日付のみ (例 2026/08/22)</option>
                                <option value="smart-date">日付変更時のみ日付表示</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-stone-600 block mb-1.5">スタンプ表示位置</label>
                            <select id="showTimestamp" class="w-full bg-white border border-rose-200/80 rounded-xl px-3 py-2 text-xs text-stone-700 focus:outline-none focus:border-rose-400 shadow-sm">
                                <option value="bottom-left">左下（セットログ風）</option>
                                <option value="center">画面中央（真ん中）</option>
                                <option value="top-left">左上</option>
                                <option value="bottom-right">右下</option>
                                <option value="top-right">右上</option>
                                <option value="bottom-center">中央下</option>
                                <option value="top-center">中央上</option>
                                <option value="none">非表示</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-stone-600 block mb-1.5">デザインスタイル</label>
                            <select id="stampStyle" class="w-full bg-white border border-rose-200/80 rounded-xl px-3 py-2 text-xs text-stone-700 focus:outline-none focus:border-rose-400 shadow-sm">
                                <option value="setlog">セットログ標準 (ダークピル)</option>
                                <option value="retro-cam">レトロビデオカメラ (ドット橙)</option>
                                <option value="cinematic">シネマティック (シャドウのみ)</option>
                                <option value="polaroid">ポラロイド風 (白カード)</option>
                                <option value="cyber-neon">サイバーネオン (グラデ枠)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-stone-600 block mb-1.5">フォントの種類</label>
                            <select id="stampFont" class="w-full bg-white border border-rose-200/80 rounded-xl px-3 py-2 text-xs text-stone-700 focus:outline-none focus:border-rose-400 shadow-sm">
                                <option value="inter">標準 (Inter / Modern)</option>
                                <option value="maru">まる文字 (丸ゴシック)</option>
                                <option value="mincho">明朝体 (エレガント)</option>
                                <option value="courier">レトロ (タイプライター)</option>
                                <option value="handwriting">手書き風 (Handwriting)</option>
                                <option value="bold">インパクト (太字)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-stone-600 block mb-1.5">フォントサイズ</label>
                            <select id="stampFontSize" class="w-full bg-white border border-rose-200/80 rounded-xl px-3 py-2 text-xs text-stone-700 focus:outline-none focus:border-rose-400 shadow-sm">
                                <option value="0.5">控えめ</option>
                                <option value="0.75">小さめ</option>
                                <option value="1.0" selected>標準</option>
                                <option value="1.25">大きめ</option>
                                <option value="1.5">特大</option>
                                <option value="2.0">超特大</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-stone-600 block mb-1.5">動画フィルター</label>
                        <select id="videoFilter" class="w-full bg-white border border-rose-200/80 rounded-xl px-3 py-2 text-xs text-stone-700 focus:outline-none focus:border-rose-400 shadow-sm">
                            <option value="none">フィルターなし (標準)</option>
                            <option value="monochrome">モノクロ (白黒)</option>
                            <option value="sepia">セピア (ノスタルジック)</option>
                            <option value="vintage">ヴィンテージ (暖色レトロ)</option>
                            <option value="cool">クール (青調/透明感)</option>
                            <option value="vivid">ビビッド (鮮やか/高コントラスト)</option>
                            <option value="cinematic">シネマティック (映画風/重厚)</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <span class="text-xs font-bold text-stone-600">元の動画音声を含める</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="keepAudio" checked class="sr-only peer">
                            <div class="w-11 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-rose-400"></div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <button id="previewBtn" disabled class="w-full py-3.5 px-4 rounded-2xl font-bold text-xs bg-white/80 hover:bg-white text-stone-700 border border-rose-200/80 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play text-rose-400"></i> プレビュー再生
                </button>
                <button id="generateBtn" disabled class="w-full py-3.5 px-4 rounded-2xl font-bold text-xs bg-gradient-to-r from-rose-400 to-rose-300 hover:from-rose-500 hover:to-rose-400 text-white shadow-md shadow-rose-300/40 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Vlog動画を生成
                </button>
            </div>
        </div>

        <!-- Right Panel: Canvas Preview & Export -->
        <div id="previewArea" class="lg:col-span-7 space-y-4">
            
            <div class="glass-panel rounded-3xl p-5 flex flex-col items-center justify-center min-h-[480px]">
                <h3 class="w-full font-bold text-stone-700 text-sm flex items-center justify-between border-b border-rose-100/80 pb-3 mb-4">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-tv text-rose-400"></i> プレビューモニター</span>
                    <span id="ratioBadge" class="text-[10px] bg-rose-100/70 text-rose-600 px-2.5 py-0.5 rounded-full font-bold font-mono border border-rose-200/50">9:16</span>
                </h3>

                <!-- Canvas Container -->
                <div id="canvasContainer" class="relative w-full max-w-[320px] aspect-[9/16] bg-stone-900 rounded-3xl overflow-hidden border-4 border-white shadow-xl shadow-rose-200/30 flex items-center justify-center transition-all duration-300">
                    <canvas id="previewCanvas" class="w-full h-full object-contain"></canvas>
                    
                    <div id="canvasOverlayText" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 bg-stone-900/85 backdrop-blur-sm pointer-events-none">
                        <div class="w-12 h-12 rounded-full bg-rose-500/10 text-rose-300 flex items-center justify-center mb-3">
                            <i class="fa-solid fa-film text-xl"></i>
                        </div>
                        <p class="text-xs font-semibold text-stone-300 leading-relaxed">動画を選択して「プレビュー」または<br>「Vlog動画を生成」をクリックしてください</p>
                    </div>

                    <!-- Processing Progress Bar -->
                    <div id="encodingProgress" class="absolute inset-0 bg-stone-900/90 backdrop-blur-md flex flex-col items-center justify-center p-6 space-y-3 hidden z-20">
                        <div class="w-12 h-12 rounded-full border-4 border-rose-200/30 border-t-rose-400 animate-spin mb-1"></div>
                        <p id="progressStatus" class="text-xs font-bold text-stone-200 text-center">書き出し中...</p>
                        <div class="w-full bg-stone-800 h-2.5 rounded-full overflow-hidden max-w-[200px] p-0.5 border border-stone-700">
                            <div id="progressBar" class="bg-gradient-to-r from-rose-400 to-rose-300 h-full w-0 transition-all duration-200 rounded-full"></div>
                        </div>
                    </div>
                </div>

                <!-- Result Card -->
                <div id="resultCard" class="w-full max-w-sm mt-5 space-y-3 hidden">
                    <div class="p-3.5 bg-emerald-50 border border-emerald-200/80 rounded-2xl flex items-center gap-3 shadow-sm">
                        <i class="fa-solid fa-circle-check text-emerald-500 text-xl"></i>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-bold text-emerald-800">Vlog動画の生成が完了しました！</p>
                            <p class="text-[11px] text-emerald-600/90 truncate" id="resultInfo">MP4 動画</p>
                        </div>
                    </div>

                    <div id="videoContainer" class="rounded-2xl overflow-hidden border-2 border-white bg-black shadow-md">
                        <video id="renderedVideo" controls class="w-full h-auto max-h-[300px] object-contain"></video>
                    </div>

                    <a id="downloadLink" href="#" download="Setlog_Vlog.mp4" class="w-full py-3.5 px-4 rounded-2xl font-bold text-xs bg-emerald-500 hover:bg-emerald-600 text-white transition-all flex items-center justify-center gap-2 shadow-md shadow-emerald-200">
                        <i class="fa-solid fa-download text-sm"></i> 完成動画をダウンロード
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div id="toastContent" class="bg-white/95 backdrop-blur-md border border-rose-100 text-stone-700 text-xs px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2.5">
            <i id="toastIcon" class="fa-solid fa-circle-info text-rose-400"></i>
            <span id="toastMsg" class="font-medium">通知メッセージ</span>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // DOM Element References
        const videoInput = document.getElementById('videoInput');
        const clipDurationInput = document.getElementById('clipDuration');
        const durationValue = document.getElementById('durationValue');
        const aspectRatioInput = document.getElementById('aspectRatio');
        const showTimestampInput = document.getElementById('showTimestamp');
        const stampFormatInput = document.getElementById('stampFormat');
        const stampStyleInput = document.getElementById('stampStyle');
        const stampFontInput = document.getElementById('stampFont');
        const stampFontSizeInput = document.getElementById('stampFontSize');
        const videoFilterInput = document.getElementById('videoFilter');

        // Automatic Beat/Tempo detection from Audio Buffer
        async function detectBpmFromBuffer(buffer) {
            try {
                const pcmData = buffer.getChannelData(0);
                const sampleRate = buffer.sampleRate;
                
                const step = Math.floor(sampleRate / 1000); // 1ms windows
                const windowCount = Math.floor(pcmData.length / step);
                const energies = new Float32Array(windowCount);

                for (let i = 0; i < windowCount; i++) {
                    let sum = 0;
                    const start = i * step;
                    for (let j = 0; j < step; j++) {
                        const val = pcmData[start + j] || 0;
                        sum += val * val;
                    }
                    energies[i] = Math.sqrt(sum / step);
                }

                const minLag = 333; // ~180 BPM
                const maxLag = 1000; // ~60 BPM
                let maxCorrelation = -1;
                let bestLag = 500; // default 120 bpm

                const testLength = Math.min(energies.length - maxLag, 10000);
                for (let lag = minLag; lag <= maxLag; lag += 2) {
                    let correlation = 0;
                    for (let i = 0; i < testLength; i++) {
                        correlation += energies[i] * energies[i + lag];
                    }
                    if (correlation > maxCorrelation) {
                        maxCorrelation = correlation;
                        bestLag = lag;
                    }
                }

                const calculatedBpm = Math.round(60000 / bestLag);
                if (calculatedBpm >= 60 && calculatedBpm <= 180) {
                    return calculatedBpm;
                }
                return 120;
            } catch (e) {
                return 120;
            }
        }

        function calculateSongFitSchedule() {
            if (uploadedClips.length === 0) return [];

            if (!useBpmSync.checked || detectedBpm <= 0 || selectedBeats !== 'song-fit' || !bgmAudioBuffer) {
                return uploadedClips.map((clip, idx) => ({
                    clip: clip,
                    originalIndex: idx,
                    duration: getTargetClipDuration()
                }));
            }

            const minBeatVal = parseInt(document.getElementById('minCutBeats')?.value || 1);
            const maxBeatVal = parseInt(document.getElementById('maxCutBeats')?.value || 16);

            const secPerBeat = 60 / detectedBpm;
            const songDuration = bgmAudioBuffer.duration;
            const totalBeats = Math.floor((songDuration * detectedBpm) / 60);

            const allBeatLevels = [1, 2, 4, 8, 16];
            const beatLevels = allBeatLevels.filter(b => b >= minBeatVal && b <= maxBeatVal);
            if (beatLevels.length === 0) beatLevels.push(minBeatVal);

            const maxClipsCount = Math.floor(totalBeats / minBeatVal);

            let availableClips = [...uploadedClips];

            if (availableClips.length > maxClipsCount && maxClipsCount > 0) {
                const sampled = [];
                const totalOriginal = availableClips.length;
                for (let i = 0; i < maxClipsCount; i++) {
                    const index = Math.min(totalOriginal - 1, Math.floor(i * (totalOriginal / maxClipsCount)));
                    sampled.push(availableClips[index]);
                }
                availableClips = sampled;
            }

            const numClips = availableClips.length;
            if (numClips === 0) return [];

            let assignedBeats = new Array(numClips).fill(beatLevels[0]);
            let currentSum = numClips * beatLevels[0];

            let attempts = 0;
            while (currentSum < totalBeats && attempts < 3000) {
                attempts++;
                const idx = Math.floor(Math.random() * numClips);
                const current = assignedBeats[idx];
                const currentLevelIdx = beatLevels.indexOf(current);

                if (currentLevelIdx < beatLevels.length - 1) {
                    const nextVal = beatLevels[currentLevelIdx + 1];
                    const diff = nextVal - current;
                    if (currentSum + diff <= totalBeats) {
                        assignedBeats[idx] = nextVal;
                        currentSum += diff;
                    }
                }
            }

            const schedule = [];
            for (let i = 0; i < numClips; i++) {
                const clip = availableClips[i];
                const beats = assignedBeats[i];
                const durationSec = Math.min(beats * secPerBeat, clip.duration);

                schedule.push({
                    clip: clip,
                    originalIndex: uploadedClips.indexOf(clip),
                    allocatedBeats: beats,
                    duration: durationSec
                });
            }

            return schedule;
        }

        async function readBufferSlice(file, start, length) {
            try {
                const slice = file.slice(start, Math.min(file.size, start + length));
                return await slice.arrayBuffer();
            } catch(e) {
                return null;
            }
        }

        async function getVideoCreationDate(file) {
            try {
                let buffer = await readBufferSlice(file, 0, 4 * 1024 * 1024);
                if (!buffer) return new Date(file.lastModified || Date.now());

                let date = parseMoovDate(buffer);
                if (date) return date;

                if (file.size > 4 * 1024 * 1024) {
                    const tailStart = Math.max(0, file.size - 4 * 1024 * 1024);
                    buffer = await readBufferSlice(file, tailStart, 4 * 1024 * 1024);
                    if (buffer) {
                        date = parseMoovDate(buffer);
                        if (date) return date;
                    }
                }
            } catch (e) {
                console.warn('Metadata parse warning:', e);
            }

            return new Date(file.lastModified || Date.now());
        }

        function parseMoovDate(buffer) {
            try {
                const view = new DataView(buffer);
                let offset = 0;
                while (offset < buffer.byteLength - 8) {
                    const size = view.getUint32(offset);
                    if (size < 8) break;

                    const type = String.fromCharCode(
                        view.getUint8(offset + 4),
                        view.getUint8(offset + 5),
                        view.getUint8(offset + 6),
                        view.getUint8(offset + 7)
                    );

                    if (type === 'moov' || type === 'mvhd') {
                        let innerOffset = (type === 'moov') ? offset + 8 : offset;
                        const innerEnd = offset + size;
                        while (innerOffset < innerEnd - 8 && innerOffset < buffer.byteLength - 8) {
                            const subSize = view.getUint32(innerOffset);
                            const subType = String.fromCharCode(
                                view.getUint8(innerOffset + 4),
                                view.getUint8(innerOffset + 5),
                                view.getUint8(innerOffset + 6),
                                view.getUint8(innerOffset + 7)
                            );

                            if (subType === 'mvhd') {
                                const version = view.getUint8(innerOffset + 8);
                                let creationTime;
                                if (version === 1) {
                                    const high = view.getUint32(innerOffset + 12);
                                    const low = view.getUint32(innerOffset + 16);
                                    creationTime = high * 0x100000000 + low;
                                } else {
                                    creationTime = view.getUint32(innerOffset + 12);
                                }
                                if (creationTime > 2082844800) {
                                    const unixEpochMs = (creationTime - 2082844800) * 1000;
                                    const parsedDate = new Date(unixEpochMs);
                                    if (!isNaN(parsedDate.getTime()) && parsedDate.getFullYear() > 2000) {
                                        return parsedDate;
                                    }
                                }
                            }
                            innerOffset += (subSize === 1) ? 16 : (subSize > 0 ? subSize : 8);
                        }
                    }
                    offset += (size === 1) ? 16 : size;
                }
            } catch (err) {}
            return null;
        }

        function resetVideoSeek(video) {
            return new Promise((resolve) => {
                if (Math.abs(video.currentTime) < 0.05 && !video.seeking) {
                    resolve();
                    return;
                }
                const onSeeked = () => {
                    video.removeEventListener('seeked', onSeeked);
                    resolve();
                };
                video.addEventListener('seeked', onSeeked);
                video.currentTime = 0;
                
                setTimeout(resolve, 300);
            });
        }

        videoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            showToast(`${files.length} 件の動画を読み込み中...`, 'info');
            let successCount = 0;
            let failedFiles = [];

            for (const file of files) {
                if (!file || file.size === 0) {
                    failedFiles.push(file ? file.name : '不明なファイル');
                    continue;
                }

                try {
                    const objectUrl = URL.createObjectURL(file);
                    const videoElem = document.createElement('video');
                    
                    videoElem.preload = 'auto';
                    videoElem.playsInline = true;
                    videoElem.muted = true;
                    videoElem.autoplay = false;
                    videoElem.setAttribute('playsinline', '');
                    videoElem.setAttribute('webkit-playsinline', '');
                    
                    hiddenVideoContainer.appendChild(videoElem);

                    const loadPromise = new Promise((resolve, reject) => {
                        let resolved = false;
                        const done = (success) => {
                            if (!resolved) {
                                resolved = true;
                                if (success) {
                                    resolve(true);
                                } else {
                                    const errDetails = videoElem.error ? `(code ${videoElem.error.code})` : '(timeout)';
                                    reject(new Error(`Video load failed ${errDetails}`));
                                }
                            }
                        };

                        if (videoElem.readyState >= 1) {
                            done(true);
                            return;
                        }

                        videoElem.addEventListener('loadedmetadata', () => done(true), { once: true });
                        videoElem.addEventListener('loadeddata', () => done(true), { once: true });
                        videoElem.addEventListener('canplay', () => done(true), { once: true });
                        videoElem.addEventListener('error', () => done(false), { once: true });
                        
                        setTimeout(() => {
                            if (videoElem.readyState >= 1) {
                                done(true);
                            } else {
                                done(false);
                            }
                        }, 15000);
                    });

                    videoElem.src = objectUrl;
                    videoElem.load();
                    
                    await loadPromise;
                    try { videoElem.currentTime = 0.1; } catch(e){}

                    const fileDate = await getVideoCreationDate(file);

                        id: Math.random().toString(36).substr(2, 9),
                        file: file,
                        objectUrl: objectUrl,
                        video: videoElem,
                        name: file.name,
                        timestamp: fileDate.getTime(),
                        duration: videoElem.duration && !isNaN(videoElem.duration) ? videoElem.duration : 3,
                        dateLabel: dateStr,
                        timeLabel: timeStr,
                        sourceNode: null
                    });

                    console.error('Video loading error:', err);
                    failedFiles.push(file.name);
                }

            uploadedClips.sort((a, b) => a.timestamp - b.timestamp);
            renderClipList();
            videoInput.value = '';

            if (failedFiles.length > 0) {

            } else if (successCount > 0) {
                showToast(`${successCount} 件の動画の準備が完了しました`, 'success');
            }

            if (uploadedClips.length > 0) {
                updateLivePreview();
            }
        });

            }
        }

        function removeClip(id) {
            const index = uploadedClips.findIndex(c => c.id === id);
            if (index !== -1) {
                const clip = uploadedClips[index];
                if (clip.objectUrl) URL.revokeObjectURL(clip.objectUrl);
                if (clip.video && clip.video.parentNode) {
                    clip.video.parentNode.removeChild(clip.video);
                }
                uploadedClips.splice(index, 1);
                if (activeClipIndex >= uploadedClips.length) {
                    activeClipIndex = Math.max(0, uploadedClips.length - 1);
                }
                renderClipList();
                updateLivePreview();
            }
        }

        function clearAllClips() {
            uploadedClips.forEach(c => {
                if (c.objectUrl) URL.revokeObjectURL(c.objectUrl);
                if (c.video && c.video.parentNode) {
                    c.video.parentNode.removeChild(c.video);
                }
            });
            uploadedClips = [];
            activeClipIndex = 0;
            renderClipList();
        }

        function drawVideoFrame(video, clip, clipIndex) {
            const cw = canvas.width;
            const ch = canvas.height;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, cw, ch);

            if (!video || video.readyState < 2) return;

            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;
            const videoRatio = vw / vh;
            const canvasRatio = cw / ch;

            let dw, dh, dx, dy;
            if (videoRatio > canvasRatio) {
                dh = ch;
                dw = ch * videoRatio;
                dx = (cw - dw) / 2;
                dy = 0;
            } else {
                dw = cw;
                dh = cw / videoRatio;
                dx = 0;
                dy = (ch - dh) / 2;
            }

            ctx.save();
            const filterType = videoFilterInput ? videoFilterInput.value : 'none';
            if (filterType === 'monochrome') {
                ctx.filter = 'grayscale(100%)';
            } else if (filterType === 'sepia') {
                ctx.filter = 'sepia(80%) brightness(95%) contrast(105%)';
            } else if (filterType === 'vintage') {
                ctx.filter = 'sepia(35%) contrast(110%) brightness(105%) saturate(120%)';
            } else if (filterType === 'cool') {
                ctx.filter = 'hue-rotate(180deg) saturate(85%) contrast(105%)';
            } else if (filterType === 'vivid') {
                ctx.filter = 'saturate(160%) contrast(115%)';
            } else if (filterType === 'cinematic') {
                ctx.filter = 'contrast(125%) brightness(90%) saturate(90%)';
            } else {
                ctx.filter = 'none';
            }

            ctx.drawImage(video, dx, dy, dw, dh);
            ctx.restore();

            const stampPosition = showTimestampInput.value;
            if (stampPosition === 'none' || !clip) return;

            const format = stampFormatInput.value;
            let displayString = clip.timeLabel;

            if (format === 'date-time') {
                displayString = `${clip.dateLabel} ${clip.timeLabel}`;
            } else if (format === 'date-only') {
                displayString = clip.dateLabel;
            } else if (format === 'smart-date') {
                const prevClip = clipIndex > 0 ? uploadedClips[clipIndex - 1] : null;
                const isDateChanged = !prevClip || prevClip.dateLabel !== clip.dateLabel;
                displayString = isDateChanged ? `${clip.dateLabel} ${clip.timeLabel}` : clip.timeLabel;
            }

            if (!displayString) return;

            ctx.save();
            const style = stampStyleInput.value;
            const fontScale = parseFloat(stampFontSizeInput ? stampFontSizeInput.value : 1.0);
            const baseFontSize = Math.round(cw * 0.09 * fontScale);

            const selectedFont = stampFontInput ? stampFontInput.value : 'inter';
            let fontCss = `bold ${baseFontSize}px Inter, sans-serif`;

            if (selectedFont === 'maru') {
                fontCss = `bold ${baseFontSize}px 'Zen Maru Gothic', sans-serif`;
            } else if (selectedFont === 'mincho') {
                fontCss = `bold ${baseFontSize}px 'Shippori Mincho', serif`;
            } else if (selectedFont === 'courier') {
                fontCss = `bold ${baseFontSize}px 'Courier Prime', 'Courier New', monospace`;
            } else if (selectedFont === 'handwriting') {
                fontCss = `bold ${Math.round(baseFontSize * 1.2)}px 'Caveat', cursive`;
            } else if (selectedFont === 'bold') {
                fontCss = `900 ${baseFontSize}px 'Inter', sans-serif`;
            } else {
                if (style === 'retro-cam') {
                    fontCss = `bold ${baseFontSize}px "Courier Prime", monospace`;
                } else if (style === 'polaroid') {
                    fontCss = `600 ${Math.round(baseFontSize * 0.95)}px Inter, sans-serif`;
                } else {
                    fontCss = `bold ${baseFontSize}px Inter, sans-serif`;
                }
            }

            ctx.font = fontCss;

            const paddingX = Math.round(cw * 0.035 * Math.max(0.8, fontScale * 0.9));
            const paddingY = Math.round(cw * 0.02 * Math.max(0.8, fontScale * 0.9));
            const textWidth = ctx.measureText(displayString).width;

            const rw = textWidth + paddingX * 1.4;
            const rh = baseFontSize + paddingY * 1.2;
            const rxMargin = paddingX * 0.8;
            const ryMargin = paddingY * 0.8;

            let rx = rxMargin;
            let ry = ch - rh - ryMargin;

            if (stampPosition === 'center') {
                rx = (cw - rw) / 2;
                ry = (ch - rh) / 2;
            } else if (stampPosition === 'top-left') {
                rx = rxMargin;
                ry = ryMargin;
            } else if (stampPosition === 'top-right') {
                rx = cw - rw - rxMargin;
                ry = ryMargin;
            } else if (stampPosition === 'bottom-right') {
                rx = cw - rw - rxMargin;
                ry = ch - rh - ryMargin;
            } else if (stampPosition === 'top-center') {
                rx = (cw - rw) / 2;
                ry = ryMargin;
            } else if (stampPosition === 'bottom-center') {
                rx = (cw - rw) / 2;
                ry = ch - rh - ryMargin;
            }

            const tx = rx + paddingX * 0.7;
            const ty = ry + baseFontSize;

            if (style === 'setlog') {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                ctx.beginPath();
                if (typeof ctx.roundRect === 'function') {
                    ctx.roundRect(rx, ry, rw, rh, 12);
                } else {
                    ctx.rect(rx, ry, rw, rh);
                }
                ctx.fill();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 6;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(displayString, tx, ty);
            } 
            else if (style === 'retro-cam') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(rx, ry, rw, rh);
                ctx.fillStyle = '#ff9900';
                ctx.shadowColor = '#ff9900';
                ctx.shadowBlur = 8;
                ctx.fillText(displayString, tx, ty);
            } 
            else if (style === 'cinematic') {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(displayString, tx, ty);
            } 
            else if (style === 'polaroid') {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                if (typeof ctx.roundRect === 'function') {
                    ctx.roundRect(rx, ry, rw, rh, 6);
                } else {
                    ctx.rect(rx, ry, rw, rh);
                }
                ctx.fill();
                ctx.fillStyle = '#0f172a';
                ctx.fillText(displayString, tx, ty);
            } 
            else if (style === 'cyber-neon') {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.beginPath();
                if (typeof ctx.roundRect === 'function') {
                    ctx.roundRect(rx, ry, rw, rh, 10);
                } else {
                    ctx.rect(rx, ry, rw, rh);
                }
                ctx.fill();
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 10;
                ctx.fillText(displayString, tx, ty);
            }

            ctx.restore();
        }

        previewBtn.addEventListener('click', async () => {
            if (isProcessing || uploadedClips.length === 0) return;
            canvasOverlayText.classList.add('hidden');
            scrollToPreviewOnMobile();

            const schedule = calculateSongFitSchedule();

            if (bgmAudioElement) {
                bgmAudioElement.currentTime = 0;
                bgmAudioElement.volume = bgmVolumeInput.value;
                try { await bgmAudioElement.play(); } catch(e){}
            }

            for (let i = 0; i < schedule.length; i++) {
                const item = schedule[i];
                const clip = item.clip;
                const video = clip.video;

                await resetVideoSeek(video);
                try {
                    await video.play();
                } catch(e) {
                    console.warn('Preview play notice:', e);
                }

                const dur = Math.min(item.duration, clip.duration);
                const startTime = Date.now();

                await new Promise((resolve) => {
                    function loop() {
                        const elapsed = (Date.now() - startTime) / 1000;
                        drawVideoFrame(video, clip, item.originalIndex);

                        if (elapsed < dur && !video.ended) {
                            requestAnimationFrame(loop);
                        } else {
                            video.pause();
                            resolve();
                        }
                    }
                    loop();
                });
            }

            if (bgmAudioElement) {
                bgmAudioElement.pause();
            }

            showToast('プレビュー表示が終了しました', 'info');
        });

        function getSupportedMimeType() {
            const types = [
                'video/mp4;codecs=h264,aac',
                'video/mp4',
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ];
            for (const type of types) {
                if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) return type;
            }
            return '';
        }

        generateBtn.addEventListener('click', async () => {
            if (uploadedClips.length === 0 || isProcessing) return;

            isProcessing = true;
            generateBtn.disabled = true;
            previewBtn.disabled = true;
            canvasOverlayText.classList.add('hidden');
            encodingProgress.classList.remove('hidden');
            resultCard.classList.add('hidden');
            scrollToPreviewOnMobile();

            const schedule = calculateSongFitSchedule();
            const keepAudio = keepAudioInput.checked;

            const fps = 30;
            const canvasStream = canvas.captureStream(fps);
            let compositeStream = new MediaStream(canvasStream.getVideoTracks());

            let audioCtx = null;
            let audioDestination = null;

            if (keepAudio || bgmAudioBuffer) {
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        audioCtx = new AudioContextClass();
                        if (audioCtx.state === 'suspended') {
                            await audioCtx.resume();
                        }
                        audioDestination = audioCtx.createMediaStreamDestination();
                        const audioTracks = audioDestination.stream.getAudioTracks();
                        if (audioTracks.length > 0) {
                            compositeStream.addTrack(audioTracks[0]);
                        }
                    }
                } catch (e) {
                    console.warn('Audio Context setup failed:', e);
                }
            }

            let bgmSourceNode = null;
            if (bgmAudioBuffer && audioCtx && audioDestination) {
                try {
                    bgmSourceNode = audioCtx.createBufferSource();
                    bgmSourceNode.buffer = bgmAudioBuffer;
                    bgmSourceNode.loop = false;

                    const bgmGain = audioCtx.createGain();
                    bgmGain.gain.value = parseFloat(bgmVolumeInput.value);
                    
                    bgmSourceNode.connect(bgmGain);
                    bgmGain.connect(audioDestination);
                    bgmSourceNode.start(0);
                } catch (err) {
                    console.warn('BGM source connect failed:', err);
                }
            }

            let mediaRecorder;
            const selectedMime = getSupportedMimeType();
            try {
                const options = selectedMime ? { mimeType: selectedMime } : {};
                mediaRecorder = new MediaRecorder(compositeStream, options);
            } catch (e) {
                console.warn('MediaRecorder init fallback:', e);
                mediaRecorder = new MediaRecorder(compositeStream);
            }

            const chunks = [];
            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) chunks.push(e.data);
            };

            const recorderStoppedPromise = new Promise((resolve) => {
                mediaRecorder.onstop = () => resolve();
            });

            mediaRecorder.start(100);
            const totalClips = schedule.length;

            for (let i = 0; i < totalClips; i++) {
                const item = schedule[i];
                const clip = item.clip;
                const video = clip.video;

                progressStatus.textContent = `クリップ ${i + 1} / ${totalClips} を書き出し中...`;
                progressBar.style.width = `${((i) / totalClips) * 100}%`;

                await resetVideoSeek(video);
                video.muted = !keepAudio;

                if (keepAudio && audioCtx && audioDestination) {
                    try {
                        if (!clip.sourceNode) {
                            clip.sourceNode = audioCtx.createMediaElementSource(video);
                        }
                        clip.sourceNode.connect(audioDestination);
                    } catch (err) {}
                }

                try {
                    await video.play();
                } catch (err) {
                    console.warn('Video play auto-try:', err);
                }

                const targetDuration = Math.min(item.duration, clip.duration);
                const startTime = Date.now();
                const timeoutLimitMs = (targetDuration + 3.0) * 1000;

                await new Promise((resolve) => {
                    let frameReqId = null;

                    function renderStep() {
                        const elapsedMs = Date.now() - startTime;
                        const elapsedSec = elapsedMs / 1000;
                        drawVideoFrame(video, clip, item.originalIndex);

                        if (elapsedSec < targetDuration && !video.ended && elapsedMs < timeoutLimitMs) {
                            frameReqId = requestAnimationFrame(renderStep);
                        } else {
                            if (frameReqId) cancelAnimationFrame(frameReqId);
                            video.pause();
                            if (clip.sourceNode) {
                                try { clip.sourceNode.disconnect(); } catch(e){}
                            }
                            resolve();
                        }
                    }
                    renderStep();
                });
            }

            progressBar.style.width = '100%';
            progressStatus.textContent = '動画ファイルを仕上げ中...';

            if (bgmSourceNode) {
                try { bgmSourceNode.stop(); } catch(e){}
            }

            if (mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            await recorderStoppedPromise;

            if (audioCtx) {
                try { await audioCtx.close(); } catch(e){}
            }

            const finalMime = mediaRecorder.mimeType || 'video/mp4';
            const isMp4 = finalMime.includes('mp4');
            const fileExt = isMp4 ? 'mp4' : 'webm';

            const blob = new Blob(chunks, { type: finalMime });
            const videoUrl = URL.createObjectURL(blob);

            renderedVideo.src = videoUrl;
            downloadLink.href = videoUrl;
            downloadLink.download = `Setlog_Vlog_${new Date().toISOString().slice(0, 10)}.${fileExt}`;
            document.getElementById('resultInfo').textContent = isMp4 ? 'MP4 動画 (スマホ/PC対応)' : 'WebM 動画';

            encodingProgress.classList.add('hidden');
            resultCard.classList.remove('hidden');
            isProcessing = false;
            generateBtn.disabled = false;
            previewBtn.disabled = false;

            showToast('1曲全自動フィットVlogの生成が完了しました！', 'success');
        });
    </script>
