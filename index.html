<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>セットログ風 自動Vlog動画編集</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f17;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(244, 63, 94, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(244, 63, 94, 0.7);
        }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-100 flex flex-col items-center">
    <!-- Hidden container for off-screen video elements (prevents Safari buffering stalls) -->
    <div id="hiddenVideoContainer" style="display:none; width:0; height:0; overflow:hidden;" aria-hidden="true"></div>

    <!-- Header -->
    <header class="w-full border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-500/20">
                    <i class="fa-solid fa-film text-white text-base"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-tight text-white flex items-center gap-2">
                        Setlog Vlog AI <span class="bg-rose-500/10 text-rose-400 text-[10px] font-semibold px-2 py-0.5 rounded-full border border-rose-500/20">Web Studio</span>
                    </h1>
                    <p class="text-[11px] text-slate-400">撮影日付・時刻スタンプ付き自動Vlogジェネレーター</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl w-full px-4 pt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Panel: Upload & Controls -->
        <div class="lg:col-span-5 space-y-5">
            
            <!-- File Upload Box -->
            <div class="glass-panel rounded-3xl p-5 space-y-4">
                <h2 class="font-bold text-slate-200 text-sm flex items-center gap-2 border-b border-slate-800 pb-3">
                    <i class="fa-solid fa-cloud-arrow-up text-rose-400"></i> 動画を選択
                </h2>
                
                <label for="videoInput" class="group relative border-2 border-dashed border-slate-700 hover:border-rose-500/60 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer transition-all duration-300 bg-slate-900/40 hover:bg-slate-900/80 text-center">
                    <input type="file" id="videoInput" accept="video/*" multiple class="hidden">
                    <div class="w-12 h-12 rounded-full bg-slate-800 group-hover:bg-rose-500/10 text-slate-400 group-hover:text-rose-400 flex items-center justify-center transition-colors mb-2">
                        <i class="fa-solid fa-video text-lg"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-300 group-hover:text-white transition-colors">動画ファイルをアップロード</span>
                    <span class="text-[10px] text-slate-500 mt-1">複数ファイル選択対応 (iPhone/Android/PC)</span>
                </label>

                <!-- File List Container -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-xs font-semibold text-slate-400">
                        <span>選択された動画</span>
                        <span id="clipCount" class="text-rose-400">0 件</span>
                    </div>

                    <div id="clipList" class="max-h-48 overflow-y-auto space-y-2 pr-1 hidden">
                        <!-- Clips inserted via JavaScript -->
                    </div>

                    <div id="emptyClipsState" class="text-center py-6 border border-slate-800/60 rounded-xl bg-slate-900/20">
                        <p class="text-xs text-slate-500">まだ動画が選択されていません</p>
                    </div>

                    <button id="clearAllBtn" onclick="clearAllClips()" class="hidden w-full py-1.5 text-xs text-slate-400 hover:text-rose-400 transition-colors border border-slate-800 rounded-lg bg-slate-900/30">
                        <i class="fa-solid fa-trash-can mr-1"></i> すべてクリア
                    </button>
                </div>
            </div>

            <!-- Settings Card -->
            <div class="glass-panel rounded-3xl p-5 space-y-4">
                <h3 class="font-bold text-slate-200 text-sm flex items-center gap-2 border-b border-slate-800 pb-3">
                    <i class="fa-solid fa-sliders text-rose-400"></i> 自動編集設定
                </h3>

                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-semibold text-slate-300 flex justify-between mb-1.5">
                            <span>1クリップあたりのカット秒数</span>
                            <span id="durationValue" class="text-rose-400 font-bold">2.0 秒</span>
                        </label>
                        <input type="range" id="clipDuration" min="1" max="5" step="0.5" value="2" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-rose-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <div>
                            <label class="text-xs font-semibold text-slate-300 block mb-1.5">出力アスペクト比</label>
                            <select id="aspectRatio" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-rose-500">
                                <option value="9:16">9:16 (TikTok/Reels/Shorts)</option>
                                <option value="16:9">16:9 (YouTube/横画面)</option>
                                <option value="1:1">1:1 (スクエア)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-300 block mb-1.5">表示コンテンツ</label>
                            <select id="stampFormat" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-rose-500">
                                <option value="time-only">時刻のみ (例 14:30)</option>
                                <option value="date-time">日付 ＋ 時刻 (例 2026/08/22 14:30)</option>
                                <option value="date-only">日付のみ (例 2026/08/22)</option>
                                <option value="smart-date">日付変更時のみ日付表示</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-semibold text-slate-300 block mb-1.5">スタンプ表示位置</label>
                            <select id="showTimestamp" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-rose-500">
                                <option value="bottom-left">左下（セットログ風）</option>
                                <option value="center">画面中央（真ん中）</option>
                                <option value="top-left">左上</option>
                                <option value="bottom-right">右下</option>
                                <option value="top-right">右上</option>
                                <option value="bottom-center">中央下</option>
                                <option value="top-center">中央上</option>
                                <option value="none">非表示</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-300 block mb-1.5">デザインスタイル</label>
                            <select id="stampStyle" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-rose-500">
                                <option value="setlog">セットログ標準 (ダークピル)</option>
                                <option value="retro-cam">レトロビデオカメラ (ドット橙)</option>
                                <option value="cinematic">シネマティック (シャドウのみ)</option>
                                <option value="polaroid">ポラロイド風 (白カード)</option>
                                <option value="cyber-neon">サイバーネオン (グラデ枠)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-semibold text-slate-300 block mb-1.5">動画フィルター</label>
                        <select id="videoFilter" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-rose-500">
                            <option value="none">フィルターなし (標準)</option>
                            <option value="monochrome">モノクロ (白黒)</option>
                            <option value="sepia">セピア (ノスタルジック)</option>
                            <option value="vintage">ヴィンテージ (暖色レトロ)</option>
                            <option value="cool">クール (青調/透明感)</option>
                            <option value="vivid">ビビッド (鮮やか/高コントラスト)</option>
                            <option value="cinematic">シネマティック (映画風/重厚)</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <span class="text-xs font-semibold text-slate-300">元の動画音声を含める</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="keepAudio" checked class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-rose-500"></div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <button id="previewBtn" disabled class="w-full py-3 px-4 rounded-xl font-bold text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> プレビュー再生
                </button>
                <button id="generateBtn" disabled class="w-full py-3 px-4 rounded-xl font-bold text-xs bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-600 hover:to-rose-700 text-white shadow-lg shadow-rose-500/25 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Vlog動画を生成
                </button>
            </div>
        </div>

        <!-- Right Panel: Canvas Preview & Export -->
        <div id="previewArea" class="lg:col-span-7 space-y-4">
            
            <div class="glass-panel rounded-3xl p-5 flex flex-col items-center justify-center min-h-[480px]">
                <h3 class="w-full font-bold text-slate-200 text-sm flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-tv text-rose-400"></i> プレビューモニター</span>
                    <span id="ratioBadge" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono">9:16</span>
                </h3>

                <!-- Canvas Container -->
                <div class="relative w-full max-w-[320px] aspect-[9/16] bg-black rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center shadow-2xl">
                    <canvas id="previewCanvas" class="w-full h-full object-contain"></canvas>
                    
                    <div id="canvasOverlayText" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 bg-slate-950/80 pointer-events-none">
                        <i class="fa-solid fa-film text-3xl text-slate-700 mb-2"></i>
                        <p class="text-xs font-semibold text-slate-400">動画を選択して「プレビュー」または<br>「Vlog動画を生成」をクリックしてください</p>
                    </div>

                    <!-- Processing Progress Bar -->
                    <div id="encodingProgress" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 space-y-3 hidden z-20">
                        <div class="w-12 h-12 rounded-full border-4 border-rose-500/20 border-t-rose-500 animate-spin mb-1"></div>
                        <p id="progressStatus" class="text-xs font-bold text-slate-200 text-center">書き出し中...</p>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden max-w-[200px]">
                            <div id="progressBar" class="bg-rose-500 h-full w-0 transition-all duration-200"></div>
                        </div>
                    </div>
                </div>

                <!-- Result Card -->
                <div id="resultCard" class="w-full max-w-sm mt-5 space-y-3 hidden">
                    <div class="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl flex items-center gap-3">
                        <i class="fa-solid fa-circle-check text-emerald-400 text-xl"></i>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-bold text-emerald-300">Vlog動画の生成が完了しました！</p>
                            <p class="text-[11px] text-emerald-400/80 truncate" id="resultInfo">MP4 動画</p>
                        </div>
                    </div>

                    <div id="videoContainer" class="rounded-xl overflow-hidden border border-slate-800 bg-black">
                        <video id="renderedVideo" controls class="w-full h-auto max-h-[300px] object-contain"></video>
                    </div>

                    <a id="downloadLink" href="#" download="Setlog_Vlog.mp4" class="w-full py-3 px-4 rounded-xl font-bold text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
                        <i class="fa-solid fa-download text-sm"></i> 完成動画をダウンロード
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div id="toastContent" class="bg-slate-900 border border-slate-700 text-slate-100 text-xs px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2.5">
            <i id="toastIcon" class="fa-solid fa-circle-info text-rose-400"></i>
            <span id="toastMsg">通知メッセージ</span>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // DOM Element References
        const videoInput = document.getElementById('videoInput');
        const clipDurationInput = document.getElementById('clipDuration');
        const durationValue = document.getElementById('durationValue');
        const aspectRatioInput = document.getElementById('aspectRatio');
        const showTimestampInput = document.getElementById('showTimestamp');
        const stampFormatInput = document.getElementById('stampFormat');
        const stampStyleInput = document.getElementById('stampStyle');
        const videoFilterInput = document.getElementById('videoFilter');
        const keepAudioInput = document.getElementById('keepAudio');
        
        const clipList = document.getElementById('clipList');
        const clipCount = document.getElementById('clipCount');
        const emptyClipsState = document.getElementById('emptyClipsState');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const generateBtn = document.getElementById('generateBtn');
        const previewBtn = document.getElementById('previewBtn');

        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const canvasOverlayText = document.getElementById('canvasOverlayText');
        const encodingProgress = document.getElementById('encodingProgress');
        const progressStatus = document.getElementById('progressStatus');
        const progressBar = document.getElementById('progressBar');
        const resultCard = document.getElementById('resultCard');
        const renderedVideo = document.getElementById('renderedVideo');
        const downloadLink = document.getElementById('downloadLink');
        const ratioBadge = document.getElementById('ratioBadge');
        const hiddenVideoContainer = document.getElementById('hiddenVideoContainer');

        // Global State
        let uploadedClips = [];
        let isProcessing = false;
        let activeClipIndex = 0; // Currently previewed clip index

        // Toast notification helper
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = message;
            if (type === 'error') {
                toastIcon.className = 'fa-solid fa-triangle-exclamation text-rose-400';
            } else if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-sky-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        function scrollToPreviewOnMobile() {
            if (window.innerWidth < 1024) {
                document.getElementById('previewArea')?.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Live static frame preview update
        function updateLivePreview() {
            if (uploadedClips.length === 0 || isProcessing) return;
            if (activeClipIndex >= uploadedClips.length) activeClipIndex = 0;

            canvasOverlayText.classList.add('hidden');
            const clip = uploadedClips[activeClipIndex];
            if (clip && clip.video) {
                drawVideoFrame(clip.video, clip, activeClipIndex);
            }
        }

        // Update Slider UI
        clipDurationInput.addEventListener('input', (e) => {
            durationValue.textContent = `${parseFloat(e.target.value).toFixed(1)} 秒`;
        });

        // Update Canvas Aspect Ratio Resolution & Redraw Preview
        function updateCanvasDimensions() {
            const ratio = aspectRatioInput.value;
            ratioBadge.textContent = ratio;
            
            if (ratio === '9:16') {
                canvas.width = 720;
                canvas.height = 1280;
            } else if (ratio === '16:9') {
                canvas.width = 1280;
                canvas.height = 720;
            } else if (ratio === '1:1') {
                canvas.width = 1080;
                canvas.height = 1080;
            }
            updateLivePreview();
        }

        aspectRatioInput.addEventListener('change', updateCanvasDimensions);
        showTimestampInput.addEventListener('change', updateLivePreview);
        stampFormatInput.addEventListener('change', updateLivePreview);
        stampStyleInput.addEventListener('change', updateLivePreview);
        videoFilterInput.addEventListener('change', updateLivePreview);

        updateCanvasDimensions();

        // Helper: read array buffer slice
        async function readBufferSlice(file, start, length) {
            try {
                const slice = file.slice(start, Math.min(file.size, start + length));
                return await slice.arrayBuffer();
            } catch(e) {
                return null;
            }
        }

        // MP4 / QuickTime MOV Atom parser to extract actual shooting time (mvhd box)
        async function getVideoCreationDate(file) {
            try {
                // Try reading start 4MB first, then end 4MB if moov atom is at file end (common in iPhone videos)
                let buffer = await readBufferSlice(file, 0, 4 * 1024 * 1024);
                if (!buffer) return new Date(file.lastModified || Date.now());

                let date = parseMoovDate(buffer);
                if (date) return date;

                // Check end of file if not found in head
                if (file.size > 4 * 1024 * 1024) {
                    const tailStart = Math.max(0, file.size - 4 * 1024 * 1024);
                    buffer = await readBufferSlice(file, tailStart, 4 * 1024 * 1024);
                    if (buffer) {
                        date = parseMoovDate(buffer);
                        if (date) return date;
                    }
                }
            } catch (e) {
                console.warn('Metadata parse warning:', e);
            }

            return new Date(file.lastModified || Date.now());
        }

        function parseMoovDate(buffer) {
            try {
                const view = new DataView(buffer);
                let offset = 0;
                while (offset < buffer.byteLength - 8) {
                    const size = view.getUint32(offset);
                    if (size < 8) break;

                    const type = String.fromCharCode(
                        view.getUint8(offset + 4),
                        view.getUint8(offset + 5),
                        view.getUint8(offset + 6),
                        view.getUint8(offset + 7)
                    );

                    if (type === 'moov' || type === 'mvhd') {
                        let innerOffset = (type === 'moov') ? offset + 8 : offset;
                        const innerEnd = offset + size;
                        while (innerOffset < innerEnd - 8 && innerOffset < buffer.byteLength - 8) {
                            const subSize = view.getUint32(innerOffset);
                            const subType = String.fromCharCode(
                                view.getUint8(innerOffset + 4),
                                view.getUint8(innerOffset + 5),
                                view.getUint8(innerOffset + 6),
                                view.getUint8(innerOffset + 7)
                            );

                            if (subType === 'mvhd') {
                                const version = view.getUint8(innerOffset + 8);
                                let creationTime;
                                if (version === 1) {
                                    const high = view.getUint32(innerOffset + 12);
                                    const low = view.getUint32(innerOffset + 16);
                                    creationTime = high * 0x100000000 + low;
                                } else {
                                    creationTime = view.getUint32(innerOffset + 12);
                                }
                                if (creationTime > 2082844800) {
                                    const unixEpochMs = (creationTime - 2082844800) * 1000;
                                    const parsedDate = new Date(unixEpochMs);
                                    if (!isNaN(parsedDate.getTime()) && parsedDate.getFullYear() > 2000) {
                                        return parsedDate;
                                    }
                                }
                            }
                            innerOffset += (subSize === 1) ? 16 : (subSize > 0 ? subSize : 8);
                        }
                    }
                    offset += (size === 1) ? 16 : size;
                }
            } catch (err) {
                // Return null to fallback safely
            }
            return null;
        }

        // Helper to reset video seek position safely
        function resetVideoSeek(video) {
            return new Promise((resolve) => {
                if (Math.abs(video.currentTime) < 0.05 && !video.seeking) {
                    resolve();
                    return;
                }
                const onSeeked = () => {
                    video.removeEventListener('seeked', onSeeked);
                    resolve();
                };
                video.addEventListener('seeked', onSeeked);
                video.currentTime = 0;
                
                // Fallback timeout in case seeked event doesn't trigger
                setTimeout(resolve, 300);
            });
        }

        // Handle File Selection
        videoInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            showToast(`${files.length} 件の動画を読み込み中...`, 'info');
            let successCount = 0;
            let failedFiles = [];

            for (const file of files) {
                if (!file || file.size === 0) {
                    failedFiles.push(file ? file.name : '不明なファイル');
                    continue;
                }

                try {
                    const objectUrl = URL.createObjectURL(file);
                    const videoElem = document.createElement('video');
                    
                    videoElem.preload = 'auto';
                    videoElem.playsInline = true;
                    videoElem.muted = true;
                    videoElem.autoplay = false;
                    videoElem.setAttribute('playsinline', '');
                    videoElem.setAttribute('webkit-playsinline', '');
                    
                    hiddenVideoContainer.appendChild(videoElem);

                    const loadPromise = new Promise((resolve, reject) => {
                        let resolved = false;
                        const done = (success) => {
                            if (!resolved) {
                                resolved = true;
                                if (success) resolve(true);
                                else reject(new Error('Video load failed'));
                            }
                        };
                        videoElem.addEventListener('loadedmetadata', () => done(true));
                        videoElem.addEventListener('error', () => done(false));
                        setTimeout(() => done(false), 5000);
                    });

                    videoElem.src = objectUrl;
                    videoElem.load();
                    
                    await loadPromise;

                    // Ensure first frame seeking for thumbnail preview
                    videoElem.currentTime = 0.1;

                    const fileDate = await getVideoCreationDate(file);
                    
                    const year = fileDate.getFullYear();
                    const month = String(fileDate.getMonth() + 1).padStart(2, '0');
                    const day = String(fileDate.getDate()).padStart(2, '0');
                    const hours = String(fileDate.getHours()).padStart(2, '0');
                    const mins = String(fileDate.getMinutes()).padStart(2, '0');

                    const dateStr = `${year}/${month}/${day}`;
                    const timeStr = `${hours}:${mins}`;

                    uploadedClips.push({
                        id: Math.random().toString(36).substr(2, 9),
                        file: file,
                        objectUrl: objectUrl,
                        video: videoElem,
                        name: file.name,
                        timestamp: fileDate.getTime(),
                        duration: videoElem.duration && !isNaN(videoElem.duration) ? videoElem.duration : 3,
                        dateLabel: dateStr,
                        timeLabel: timeStr,
                        sourceNode: null
                    });
                    successCount++;
                } catch (err) {
                    console.error('Video loading error:', err);
                    failedFiles.push(file.name);
                }
            }

            uploadedClips.sort((a, b) => a.timestamp - b.timestamp);
            renderClipList();
            videoInput.value = '';

            if (failedFiles.length > 0) {
                showToast(`${failedFiles.join(', ')} を読み込めませんでした。`, 'error');
            } else if (successCount > 0) {
                showToast(`${successCount} 件の動画の準備が完了しました`, 'success');
            }

            if (uploadedClips.length > 0) {
                updateLivePreview();
            }
        });

        // Render Clips List UI
        function renderClipList() {
            clipList.innerHTML = '';
            clipCount.textContent = `${uploadedClips.length} 件`;

            if (uploadedClips.length === 0) {
                emptyClipsState.classList.remove('hidden');
                clipList.classList.add('hidden');
                clearAllBtn.classList.add('hidden');
                generateBtn.disabled = true;
                previewBtn.disabled = true;
                canvasOverlayText.classList.remove('hidden');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            emptyClipsState.classList.add('hidden');
            clipList.classList.remove('hidden');
            clearAllBtn.classList.remove('hidden');
            generateBtn.disabled = false;
            previewBtn.disabled = false;

            uploadedClips.forEach((clip, index) => {
                const isActive = index === activeClipIndex;
                const item = document.createElement('div');
                item.className = `flex flex-col gap-1 p-2.5 bg-slate-900/90 border ${isActive ? 'border-rose-500 shadow-md shadow-rose-500/10' : 'border-slate-800'} rounded-xl hover:border-slate-700 transition-all text-xs cursor-pointer`;
                
                item.onclick = (e) => {
                    // Prevent triggering selection when editing text inputs
                    if (e.target.tagName === 'INPUT' || e.target.closest('button')) return;
                    activeClipIndex = index;
                    renderClipList();
                    updateLivePreview();
                };

                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="w-5 h-5 rounded-md ${isActive ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-400'} flex items-center justify-center text-[10px] font-bold shrink-0">${index + 1}</span>
                            <p class="font-medium ${isActive ? 'text-white' : 'text-slate-200'} truncate max-w-[150px] sm:max-w-[180px]">${clip.name}</p>
                        </div>
                        <button onclick="removeClip('${clip.id}')" class="text-slate-500 hover:text-rose-400 p-1 transition-colors">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    </div>
                    <div class="flex items-center gap-2 pl-7 text-[11px]">
                        <input type="text" value="${clip.dateLabel}" onchange="updateClipDate('${clip.id}', this.value)" title="日付を編集" class="bg-slate-950 border border-slate-800 text-slate-300 rounded px-1.5 py-0.5 w-24 text-[10px] focus:outline-none focus:border-rose-500">
                        <input type="text" value="${clip.timeLabel}" onchange="updateClipTime('${clip.id}', this.value)" title="時刻を編集" class="bg-slate-950 border border-slate-800 text-slate-300 rounded px-1.5 py-0.5 w-16 text-[10px] focus:outline-none focus:border-rose-500">
                    </div>
                `;
                clipList.appendChild(item);
            });
        }

        function updateClipDate(id, newDate) {
            const clip = uploadedClips.find(c => c.id === id);
            if (clip) {
                clip.dateLabel = newDate.trim();
                updateLivePreview();
            }
        }

        function updateClipTime(id, newTime) {
            const clip = uploadedClips.find(c => c.id === id);
            if (clip) {
                clip.timeLabel = newTime.trim();
                updateLivePreview();
            }
        }

        function removeClip(id) {
            const index = uploadedClips.findIndex(c => c.id === id);
            if (index !== -1) {
                const clip = uploadedClips[index];
                if (clip.objectUrl) URL.revokeObjectURL(clip.objectUrl);
                if (clip.video && clip.video.parentNode) {
                    clip.video.parentNode.removeChild(clip.video);
                }
                uploadedClips.splice(index, 1);
                if (activeClipIndex >= uploadedClips.length) {
                    activeClipIndex = Math.max(0, uploadedClips.length - 1);
                }
                renderClipList();
                updateLivePreview();
            }
        }

        function clearAllClips() {
            uploadedClips.forEach(c => {
                if (c.objectUrl) URL.revokeObjectURL(c.objectUrl);
                if (c.video && c.video.parentNode) {
                    c.video.parentNode.removeChild(c.video);
                }
            });
            uploadedClips = [];
            activeClipIndex = 0;
            renderClipList();
        }

        // Draw video frame & overlays onto preview canvas
        function drawVideoFrame(video, clip, clipIndex) {
            const cw = canvas.width;
            const ch = canvas.height;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, cw, ch);

            if (!video || video.readyState < 2) return;

            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;
            const videoRatio = vw / vh;
            const canvasRatio = cw / ch;

            let dw, dh, dx, dy;
            if (videoRatio > canvasRatio) {
                dh = ch;
                dw = ch * videoRatio;
                dx = (cw - dw) / 2;
                dy = 0;
            } else {
                dw = cw;
                dh = cw / videoRatio;
                dx = 0;
                dy = (ch - dh) / 2;
            }

            // Apply Video Filter
            ctx.save();
            const filterType = videoFilterInput ? videoFilterInput.value : 'none';
            if (filterType === 'monochrome') {
                ctx.filter = 'grayscale(100%)';
            } else if (filterType === 'sepia') {
                ctx.filter = 'sepia(80%) brightness(95%) contrast(105%)';
            } else if (filterType === 'vintage') {
                ctx.filter = 'sepia(35%) contrast(110%) brightness(105%) saturate(120%)';
            } else if (filterType === 'cool') {
                ctx.filter = 'hue-rotate(180deg) saturate(85%) contrast(105%)';
            } else if (filterType === 'vivid') {
                ctx.filter = 'saturate(160%) contrast(115%)';
            } else if (filterType === 'cinematic') {
                ctx.filter = 'contrast(125%) brightness(90%) saturate(90%)';
            } else {
                ctx.filter = 'none';
            }

            ctx.drawImage(video, dx, dy, dw, dh);
            ctx.restore(); // Restore filter state so stamp is clean

            // Stamp Position & Text Format Processing
            const stampPosition = showTimestampInput.value;
            if (stampPosition === 'none' || !clip) return;

            const format = stampFormatInput.value;
            let displayString = clip.timeLabel;

            if (format === 'date-time') {
                displayString = `${clip.dateLabel} ${clip.timeLabel}`;
            } else if (format === 'date-only') {
                displayString = clip.dateLabel;
            } else if (format === 'smart-date') {
                const prevClip = clipIndex > 0 ? uploadedClips[clipIndex - 1] : null;
                const isDateChanged = !prevClip || prevClip.dateLabel !== clip.dateLabel;
                displayString = isDateChanged ? `${clip.dateLabel} ${clip.timeLabel}` : clip.timeLabel;
            }

            if (!displayString) return;

            ctx.save();
            const style = stampStyleInput.value;
            const fontSize = Math.round(cw * 0.045);

            if (style === 'retro-cam') {
                ctx.font = `bold ${fontSize}px "Courier New", monospace`;
            } else if (style === 'polaroid') {
                ctx.font = `600 ${fontSize * 0.95}px Inter, sans-serif`;
            } else {
                ctx.font = `bold ${fontSize}px Inter, sans-serif`;
            }

            const paddingX = Math.round(cw * 0.035);
            const paddingY = Math.round(cw * 0.02);
            const textWidth = ctx.measureText(displayString).width;

            const rw = textWidth + paddingX * 1.4;
            const rh = fontSize + paddingY * 1.2;
            const rxMargin = paddingX * 0.8;
            const ryMargin = paddingY * 0.8;

            let rx = rxMargin;
            let ry = ch - rh - ryMargin;

            if (stampPosition === 'center') {
                rx = (cw - rw) / 2;
                ry = (ch - rh) / 2;
            } else if (stampPosition === 'top-left') {
                rx = rxMargin;
                ry = ryMargin;
            } else if (stampPosition === 'top-right') {
                rx = cw - rw - rxMargin;
                ry = ryMargin;
            } else if (stampPosition === 'bottom-right') {
                rx = cw - rw - rxMargin;
                ry = ch - rh - ryMargin;
            } else if (stampPosition === 'top-center') {
                rx = (cw - rw) / 2;
                ry = ryMargin;
            } else if (stampPosition === 'bottom-center') {
                rx = (cw - rw) / 2;
                ry = ch - rh - ryMargin;
            }

            const tx = rx + paddingX * 0.7;
            const ty = ry + fontSize;

            // Render Styles
            if (style === 'setlog') {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                ctx.beginPath();
                if (typeof ctx.roundRect === 'function') {
                    ctx.roundRect(rx, ry, rw, rh, 12);
                } else {
                    ctx.rect(rx, ry, rw, rh);
                }
                ctx.fill();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 6;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(displayString, tx, ty);
            } 
            else if (style === 'retro-cam') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(rx, ry, rw, rh);
                ctx.fillStyle = '#ff9900';
                ctx.shadowColor = '#ff9900';
                ctx.shadowBlur = 8;
                ctx.fillText(displayString, tx, ty);
            } 
            else if (style === 'cinematic') {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(displayString, tx, ty);
            } 
            else if (style === 'polaroid') {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                if (typeof ctx.roundRect === 'function') {
                    ctx.roundRect(rx, ry, rw, rh, 6);
                } else {
                    ctx.rect(rx, ry, rw, rh);
                }
                ctx.fill();
                ctx.fillStyle = '#0f172a';
                ctx.fillText(displayString, tx, ty);
            } 
            else if (style === 'cyber-neon') {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.beginPath();
                if (typeof ctx.roundRect === 'function') {
                    ctx.roundRect(rx, ry, rw, rh, 10);
                } else {
                    ctx.rect(rx, ry, rw, rh);
                }
                ctx.fill();
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 10;
                ctx.fillText(displayString, tx, ty);
            }

            ctx.restore();
        }

        // Preview Button Action
        previewBtn.addEventListener('click', async () => {
            if (isProcessing || uploadedClips.length === 0) return;
            canvasOverlayText.classList.add('hidden');
            scrollToPreviewOnMobile();

            const maxClipDur = parseFloat(clipDurationInput.value);

            for (let i = 0; i < uploadedClips.length; i++) {
                const clip = uploadedClips[i];
                const video = clip.video;

                await resetVideoSeek(video);
                try {
                    await video.play();
                } catch(e) {
                    console.warn('Preview play notice:', e);
                }

                const dur = Math.min(maxClipDur, clip.duration);
                const startTime = Date.now();

                await new Promise((resolve) => {
                    function loop() {
                        const elapsed = (Date.now() - startTime) / 1000;
                        drawVideoFrame(video, clip, i);

                        if (elapsed < dur && !video.ended) {
                            requestAnimationFrame(loop);
                        } else {
                            video.pause();
                            resolve();
                        }
                    }
                    loop();
                });
            }
            showToast('プレビュー表示が終了しました', 'info');
        });

        // MIME Type helper for cross-device support
        function getSupportedMimeType() {
            const types = [
                'video/mp4;codecs=h264,aac',
                'video/mp4',
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ];
            for (const type of types) {
                if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) return type;
            }
            return '';
        }

        // Export Video Action
        generateBtn.addEventListener('click', async () => {
            if (uploadedClips.length === 0 || isProcessing) return;

            isProcessing = true;
            generateBtn.disabled = true;
            previewBtn.disabled = true;
            canvasOverlayText.classList.add('hidden');
            encodingProgress.classList.remove('hidden');
            resultCard.classList.add('hidden');
            scrollToPreviewOnMobile();

            const maxClipDur = parseFloat(clipDurationInput.value);
            const keepAudio = keepAudioInput.checked;

            const fps = 30;
            const canvasStream = canvas.captureStream(fps);
            let compositeStream = new MediaStream(canvasStream.getVideoTracks());

            // Audio Context setup for robust audio mixing
            let audioCtx = null;
            let audioDestination = null;

            if (keepAudio) {
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        audioCtx = new AudioContextClass();
                        if (audioCtx.state === 'suspended') {
                            await audioCtx.resume();
                        }
                        audioDestination = audioCtx.createMediaStreamDestination();
                        const audioTracks = audioDestination.stream.getAudioTracks();
                        if (audioTracks.length > 0) {
                            compositeStream.addTrack(audioTracks[0]);
                        }
                    }
                } catch (e) {
                    console.warn('Audio Context setup failed:', e);
                }
            }

            let mediaRecorder;
            const selectedMime = getSupportedMimeType();
            try {
                const options = selectedMime ? { mimeType: selectedMime } : {};
                mediaRecorder = new MediaRecorder(compositeStream, options);
            } catch (e) {
                console.warn('MediaRecorder init fallback:', e);
                mediaRecorder = new MediaRecorder(compositeStream);
            }

            const chunks = [];
            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) chunks.push(e.data);
            };

            const recorderStoppedPromise = new Promise((resolve) => {
                mediaRecorder.onstop = () => resolve();
            });

            mediaRecorder.start(100);
            const totalClips = uploadedClips.length;

            for (let i = 0; i < totalClips; i++) {
                const clip = uploadedClips[i];
                const video = clip.video;

                progressStatus.textContent = `クリップ ${i + 1} / ${totalClips} を書き出し中...`;
                progressBar.style.width = `${((i) / totalClips) * 100}%`;

                await resetVideoSeek(video);
                video.muted = !keepAudio;

                // Reuse cached audio node to avoid InvalidStateError on repeated exports
                if (keepAudio && audioCtx && audioDestination) {
                    try {
                        if (!clip.sourceNode) {
                            clip.sourceNode = audioCtx.createMediaElementSource(video);
                        }
                        clip.sourceNode.connect(audioDestination);
                    } catch (err) {
                        // Node connected or fallback handled
                    }
                }

                try {
                    await video.play();
                } catch (err) {
                    console.warn('Video play auto-try:', err);
                }

                const targetDuration = Math.min(maxClipDur, clip.duration);
                const startTime = Date.now();
                // Timeout safeguard (target duration + 3 seconds extra buffer time)
                const timeoutLimitMs = (targetDuration + 3.0) * 1000;

                await new Promise((resolve) => {
                    let frameReqId = null;

                    function renderStep() {
                        const elapsedMs = Date.now() - startTime;
                        const elapsedSec = elapsedMs / 1000;
                        drawVideoFrame(video, clip, i);

                        if (elapsedSec < targetDuration && !video.ended && elapsedMs < timeoutLimitMs) {
                            frameReqId = requestAnimationFrame(renderStep);
                        } else {
                            if (frameReqId) cancelAnimationFrame(frameReqId);
                            video.pause();
                            if (clip.sourceNode) {
                                try { clip.sourceNode.disconnect(); } catch(e){}
                            }
                            resolve();
                        }
                    }
                    renderStep();
                });
            }

            progressBar.style.width = '100%';
            progressStatus.textContent = '動画ファイルを仕上げ中...';

            if (mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            await recorderStoppedPromise;

            if (audioCtx) {
                try { await audioCtx.close(); } catch(e){}
            }

            const finalMime = mediaRecorder.mimeType || 'video/mp4';
            const isMp4 = finalMime.includes('mp4');
            const fileExt = isMp4 ? 'mp4' : 'webm';

            const blob = new Blob(chunks, { type: finalMime });
            const videoUrl = URL.createObjectURL(blob);

            renderedVideo.src = videoUrl;
            downloadLink.href = videoUrl;
            downloadLink.download = `Setlog_Vlog_${new Date().toISOString().slice(0, 10)}.${fileExt}`;
            document.getElementById('resultInfo').textContent = isMp4 ? 'MP4 動画 (スマホ/PC対応)' : 'WebM 動画';

            encodingProgress.classList.add('hidden');
            resultCard.classList.remove('hidden');
            isProcessing = false;
            generateBtn.disabled = false;
            previewBtn.disabled = false;

            showToast('自動Vlogの生成が完了しました！', 'success');
        });
    </script>
</body>
</html>
